[package]
edition = "2024"
name = "seal_policies"
version = "0.0.3"
license = "0BSD"
# No `published-at`: the live testnet package 0x9f0563bf…231e is recorded in Published.toml
# (Sui >= 1.80). 0x67520f80…88d3 is a broken stray publish that bundles its own copy of the
# access_gate module (linkage 0x1/0x2 only), so no real gate can be used with it (audit F8).

# Depends on the access-gate primitive for the `nft_gate` policy. The Sui framework is an
# implicit system dependency (as in access-gate-sui). access_gate is consumer-agnostic and
# is NOT modified by this package — we only read its `Gate` / access-NFT verifiers.
#
# The dependency's own manifest defines the `access_gate` named address; do not redeclare it
# here (Sui CLI >= 1.80 rejects a duplicate). The rev is pinned to an immutable COMMIT SHA (never a
# mutable tag — `v0.0.1` has already been moved).
#
# 8f38cfb is the access-gate source this package's `nft_gate` needs (GatePolicy /
# `gate_pause_blocks_decryption`). It is NOT yet published: release order is (1) push + publish
# access-gate-sui and record its Published.toml, (2) bump this rev to the commit that records that
# publication, (3) rebuild (regenerates Move.lock) and publish this package. The live testnet
# seal_policies 0x9f0563… was built from f191c2d (→ access_gate 0x0bedd0…).
[dependencies]
access_gate = { git = "https://github.com/meddleware-org/access-gate-sui.git", rev = "8f38cfba382af9349bb8c7907151bd94aacb0a49" }

