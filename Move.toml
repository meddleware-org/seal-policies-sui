[package]
edition = "2024"
name = "seal_policies"
version = "0.0.3"
license = "0BSD"
# No `published-at`: the testnet package 0x42cc181f…d612 (linking access_gate 0x1a81ca17…eea4) is
# recorded in Published.toml (Sui >= 1.80). Superseded: 0x9f0563bf…231e (linked access_gate
# 0x0bedd0…). 0x67520f80…88d3 is a broken stray that bundles its own access_gate (UpgradeCap burned;
# audit F8).

# Depends on the access-gate primitive for the `nft_gate` policy. The Sui framework is an
# implicit system dependency (as in access-gate-sui). access_gate is consumer-agnostic and
# is NOT modified by this package — we only read its `Gate` / access-NFT verifiers.
#
# The dependency's own manifest defines the `access_gate` named address; do not redeclare it
# here (Sui CLI >= 1.80 rejects a duplicate). The rev is pinned to an immutable COMMIT SHA (never a
# mutable tag — `v0.0.1` has already been moved).
#
# dcd2d3c is the access-gate commit that records the testnet publication 0x1a81ca… (Published.toml)
# this package was published against. Move.lock still pins the previous rev until that commit is on
# GitHub: after pushing access-gate-sui, run `sui move build --build-env testnet` here and commit
# the regenerated Move.lock (CI fails until then).
[dependencies]
access_gate = { git = "https://github.com/meddleware-org/access-gate-sui.git", rev = "dcd2d3c2f918904950e8cb079d0c648fc79475f3" }

