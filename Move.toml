[package]
edition = "2024"
name = "seal_policies"
version = "0.0.3"
license = "0BSD"
published-at = "0x67520f808bd47014c813841d654e2863619628db598c5943cc67f463466088d3"

# Depends on the access-gate primitive for the `nft_gate` policy. The Sui framework is an
# implicit system dependency (as in access-gate-sui). access_gate is consumer-agnostic and
# is NOT modified by this package — we only read its `Gate` / access-NFT verifiers.
#
# The dependency's own manifest defines the `access_gate` named address; do not redeclare it
# here (Sui CLI >= 1.80 rejects a duplicate). The rev is pinned to an immutable COMMIT SHA (not a
# tag — tags are mutable, and `v0.0.1` has been moved): f191c2d is the revision whose manifest
# resolves `access_gate` to the canonical testnet package 0x0bedd0…, which the published
# seal_policies links against. Bump deliberately, together with the address it resolves to.
[dependencies]
access_gate = { git = "https://github.com/meddleware-org/access-gate-sui.git", rev = "f191c2d338006c056d4ecfafa9bb0404afed37a5" }

